name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          MAX_SIZE_KB=250
          MUI_CHUNK=$(ls dist/assets/vendor-mui-*.js 2>/dev/null | head -1)
          if [ -z "$MUI_CHUNK" ]; then
            echo "ERROR: vendor-mui chunk not found!"
            exit 1
          fi
          SIZE_KB=$(du -k "$MUI_CHUNK" | cut -f1)
          echo "vendor-mui chunk: ${SIZE_KB}kB (limit: ${MAX_SIZE_KB}kB)"
          if [ "$SIZE_KB" -gt "$MAX_SIZE_KB" ]; then
            echo "ERROR: vendor-mui chunk (${SIZE_KB}kB) exceeds ${MAX_SIZE_KB}kB limit!"
            exit 1
          fi
          echo "OK: vendor-mui chunk is within budget."

      - name: Get version and zip dist folder
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd dist && zip -r "../iw-auto-login-v${VERSION}.zip" .
          echo "zipname=iw-auto-login-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: iw-auto-login-v${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.zipname }}

  release-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changelog
        run: npm run lint:changelog

      - name: Test release script
        run: bash test_release.sh

      - name: Test changelog update
        run: bash test_changelog_update.sh
