name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Zip dist folder
        run: cd dist && zip -r ../iw-auto-login-dist.zip .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: iw-auto-login-dist
          path: iw-auto-login-dist.zip
