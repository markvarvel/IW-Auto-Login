name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package.json version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "Note: npm run build auto-bumps the version, so this must run before build."
            exit 1
          fi
          echo "Tag version matches package.json: $TAG_VERSION"

      - name: Validate README mentions latest version
        run: |
          if ! grep -q "iw-auto-login-v" README.md; then
            echo "ERROR: README.md does not mention versioned zip filename"
            exit 1
          fi
          if grep -q "iw-auto-login-dist.zip" README.md; then
            echo "ERROR: README.md still references old zip filename"
            exit 1
          fi
          echo "README.md versioned zip references are correct."

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          MAX_SIZE_KB=250
          MUI_CHUNK=$(ls dist/assets/vendor-mui-*.js 2>/dev/null | head -1)
          if [ -z "$MUI_CHUNK" ]; then
            echo "ERROR: vendor-mui chunk not found!"
            exit 1
          fi
          SIZE_KB=$(du -k "$MUI_CHUNK" | cut -f1)
          echo "vendor-mui chunk: ${SIZE_KB}kB (limit: ${MAX_SIZE_KB}kB)"
          if [ "$SIZE_KB" -gt "$MAX_SIZE_KB" ]; then
            echo "ERROR: vendor-mui chunk exceeds limit!"
            exit 1
          fi
          echo "OK: vendor-mui chunk is within budget."

      - name: Fix version in dist
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p='dist/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(m,null,2));console.log('Reset dist/manifest.json to',m.version)"

      - name: Zip dist folder
        run: |
          cd dist && zip -r "../iw-auto-login-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "IW-Auto-Login ${{ github.ref_name }}" \
            --generate-notes \
            "iw-auto-login-${{ github.ref_name }}.zip"
